# Scheduled workflows auto-disable after 60 days without repo activity; this records activity every 14 days.
name: keepalive
on:
  schedule: [{ cron: "17 9 */14 * *" }]
  workflow_dispatch: {}
permissions: { contents: write, actions: write }
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%FT%TZ > .keepalive
          git config user.name "keepalive-bot" && git config user.email "keepalive@users.noreply.github.com"
          git add .keepalive && git commit -m "keepalive: $(date -u +%F)" && git push || echo "nothing to commit"
      - name: Re-enable scheduled workflows
        run: for w in snapshot.yml nightly.yml weekly-trends.yml; do gh workflow enable "$w" || true; done
        env: { GH_TOKEN: "${{ github.token }}" }

# Writer B: full-engine snapshot every 20 min on off-minutes. Publishes data to the orphan branch `snapshot-data`
# (served by raw.githubusercontent.com with CORS *), and to GitHub Pages when Pages is enabled in repo settings.
name: snapshot
on:
  schedule: [{ cron: "7,27,47 * * * *" }]
  workflow_dispatch: {}
  push: { branches: [claude/nba-pregame-matchup-report-fvu96u], paths: ["site/**", "core/**", "scripts/**", ".github/workflows/snapshot.yml"] }
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Day-1 probe T2/T4 (ESPN + cdn.nba.com from GitHub egress)
        run: node scripts/probe.mjs | tee probe.txt
      - name: Carry forward published data files
        run: |
          mkdir -p site/data
          for f in daily.json trends.json trends-diff.json runs.json; do
            curl -fsS -m 15 "https://raw.githubusercontent.com/benjaminkorzep-rgb/STORMYS_LABORATORY_THE_ODDS_API_KEY/snapshot-data/$f" -o "site/data/$f" || curl -fsS -m 15 "https://benjaminkorzep-rgb.github.io/STORMYS_LABORATORY_THE_ODDS_API_KEY/data/$f" -o "site/data/$f" || true
          done
      - name: Daily player data (once per ET day, or when missing)
        run: |
          TODAY=$(TZ=America/New_York date -d '-6 hours' +%F)
          if ! grep -q "\"date\":\"$TODAY\"" site/data/daily.json 2>/dev/null; then node scripts/build-daily.mjs; else echo "daily.json is current ($TODAY)"; fi
      - name: Build snapshot
        run: node scripts/build-snapshot.mjs
      - name: Copy shared core into the site
        run: rm -rf site/core && cp -r core site/core && cp probe.txt site/data/probe-actions.txt
      - name: Publish data to the snapshot-data branch
        run: |
          mkdir -p /tmp/pub && cp site/data/*.json site/data/probe-actions.txt /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q -b snapshot-data && git config user.name "snapshot-bot" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "snapshot $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshot-data
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with: { path: site }
    outputs: { pages: "${{ steps.pages.outcome }}" }
  deploy:
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
